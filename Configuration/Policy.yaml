privilegeTargets:
  'Neos\Neos\Security\Authorization\Privilege\ModulePrivilege':
    'ISP.Carteo:ManagerModule':
      matcher: 'isp-carteo/managerModule'
    'ISP.Carteo:StudioModule':
      matcher: 'isp-carteo/studioModule'
    'ISP.Carteo:OrderModule':
      matcher: 'isp-carteo/orderModule'
    'ISP.Carteo:OverviewModule':
      matcher: 'isp-carteo'
roles:
  'Neos.Neos:Editor':
    privileges:
      -
        privilegeTarget: 'ISP.Carteo:ManagerModule'
        permission: GRANT
      -
        privilegeTarget: 'ISP.Carteo:StudioModule'
        permission: GRANT
      -
        privilegeTarget: 'ISP.Carteo:OrderModule'
        permission: GRANT
      -
        privilegeTarget: 'ISP.Carteo:OverviewModule'
        permission: GRANT
  'Neos.Flow:Everybody':
    privileges:
      -
        privilegeTarget: 'ISP.Carteo:OrderModule'
        permission: GRANT